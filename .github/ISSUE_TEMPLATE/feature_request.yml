name: Feature request
description: Suggest a focused improvement to StyleMate
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem and desired outcome. Do not include API keys, tokens, personal images, or other secrets.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should this change address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful change and how a user would interact with it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternatives or workarounds you have considered.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add non-sensitive examples, links, or constraints.
